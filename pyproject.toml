[project]
name = "semantic-api-diagnosis"
version = "0.1.0"
description = "Skeleton for generating and validating NLP datasets for semantic API diagnosis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
train = [
    "accelerate>=1.1",
    "datasets>=2.19",
    "scikit-learn>=1.4",
    "torch>=2.4",
    "transformers>=4.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semantic_api_diagnosis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
